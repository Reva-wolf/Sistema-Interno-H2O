<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b5f78"><title>H2O • Sistema Interno</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
  <div><h1>H2O</h1><span>Sistema Interno</span></div>
  <button id="voiceButton" class="voice">🎙️ Voz</button>
  <span id="vozStatus" class="muted voz-status"></span>
</header>
<main>
<section class="toolbar">
  <label>Data<input id="data" type="date"></label>
  <button class="secundario" id="btnFuncionarios">👤 Funcionários</button>
  <button class="primary" id="novo">＋ Agendamento</button>
</section>
<nav class="tabs">
<button class="tab active" data-setor="BANHO">🛁 Banho e Tosa</button>
<button class="tab" data-setor="CLINICA">🩺 Clínica</button>
<button class="tab" data-setor="LOJA">🏪 Loja</button>
<button class="tab" data-setor="FINALIZADOS">✅ Finalizados</button>
<button class="tab alerttab" id="alertasTab">🚨 Alertas <b id="alertCount">0</b></button>
</nav>
<section class="summary">
<div class="card"><strong id="total">0</strong><span>Agendados</span></div>
<div class="card"><strong id="aguardando">0</strong><span>Aguardando</span></div>
<div class="card"><strong id="andamento">0</strong><span>Em andamento</span></div>
<div class="card"><strong id="liberados">0</strong><span>Liberados</span></div>
<div class="card loja-summary"><strong id="lojaTotal">R$ 0,00</strong><span>Consumo da Loja</span></div>
</section>
<section class="agenda">
<div class="agenda-head"><h2 id="titulo">Agenda — Banho e Tosa</h2><span id="subtitulo">20 horários</span></div>
<div id="lista" class="lista"></div>
</section>
</main>

<div id="modal" class="modal hidden"><div class="modal-box">
<button class="close" id="fechar">×</button><h2 id="modalAgendamentoTitulo">Novo agendamento</h2>
<form id="form">
<div class="grid2">
<label>Data<input name="data" id="fdata" type="date" required></label>
<label>Horário<select name="horario" id="novoHorario" required></select></label>
<label>Tutor
  <div class="linha-add"><select name="tutor_id" id="tutor" required></select><button type="button" class="secundario" id="btnNovoTutor">＋ novo</button></div>
</label>
<label>Pet
  <div class="linha-add"><select name="pet_id" id="pet" required></select><button type="button" class="secundario" id="btnNovoPet">＋ novo</button></div>
</label>
<label>Espécie<input id="especie" readonly placeholder="Selecionada pelo pet"></label>
<label>Serviço<select name="servico" id="servicoSelect" required><option value="">Selecione...</option></select></label>
<label>Valor total (R$)<input name="valor_total" id="valorTotal" type="number" step="0.01" min="0" placeholder="0,00"></label>
<label>Valor do transporte (R$)<input name="valor_transporte" id="valorTransporte" type="number" step="0.01" min="0" placeholder="Se houver"></label>
</div>
<label>Observações<textarea name="observacoes" rows="3"></textarea></label>
<button class="primary full">Salvar</button>
</form>
<p id="formMsg" class="muted"></p>
</div></div>

<div id="modalTutor" class="modal hidden"><div class="modal-box">
<button class="close" id="fecharNovoTutor">×</button><h2>Novo tutor</h2>
<form id="formTutor">
<label>Nome<input name="nome" required></label>
<label>Telefone<input name="telefone" placeholder="(00) 00000-0000"></label>
<button class="primary full">Salvar tutor</button>
</form>
<p id="formTutorMsg" class="muted"></p>
</div></div>

<div id="modalPet" class="modal hidden"><div class="modal-box">
<button class="close" id="fecharNovoPet">×</button><h2>Novo pet</h2>
<form id="formPet">
<label>Tutor do pet<select name="tutor_id" id="petTutorId" required></select></label>
<label>Nome do pet<input name="nome" required></label>
<label>Espécie
  <select name="especie" required>
    <option value="">Selecione...</option>
    <option value="CAO">🐶 Cão</option>
    <option value="GATO">🐱 Gato</option>
  </select>
</label>
<button class="primary full">Salvar pet</button>
</form>
<p id="formPetMsg" class="muted"></p>
</div></div>

<div id="alertModal" class="modal hidden"><div class="modal-box">
<button class="close" id="fecharAlertas">×</button><h2>🚨 Alertas para Clínica</h2>
<div id="alertList"></div>
</div></div>

<div id="funcModal" class="modal hidden"><div class="modal-box">
<button class="close" id="fecharFuncionarios">×</button><h2>👤 Funcionários</h2>
<div class="func-col">
 <h3>🛁 Banho e Tosa</h3>
 <div id="listaFuncBanho" class="func-lista"></div>
 <form id="formFuncBanho" class="func-form">
  <input name="nome" placeholder="Nome do funcionário" required>
  <button type="submit" class="primary">＋ Adicionar</button>
 </form>
</div>
<div class="func-col">
 <h3>🩺 Clínica</h3>
 <div id="listaFuncClinica" class="func-lista"></div>
 <form id="formFuncClinica" class="func-form">
  <input name="nome" placeholder="Nome do funcionário/veterinário" required>
  <button type="submit" class="primary">＋ Adicionar</button>
 </form>
</div>
</div></div>

<script src="/js/app.js"></script>
</body></html>
